<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box1 {
        height: 200px;
        width: 200px;
        background-color: orange;
      }
      .box2 {
        height: 50vh;
        width: 50vw;
        background-color: pink;
      }
      .box3 {
        height: 50vh;
        width: 50vw;
        background-color: royalblue;
      }
      .box3 > .child {
        height: 50%;
        width: 50%;
        background-color: whitesmoke;
      }

      /* depend on current element fontsize || by default 1em = 16px*/
      .box4 {
        height: 1em;
        width: 1em;
        background-color: lightblue;
        font-size: 100px;
      }

      /* depend on root element fontsize || by default 1em = 16px*/
      html {
        font-size: 20px;
      }

      .box5 {
        height: 1rem;
        width: 1rem;
        background-color: aqua;
      }
    </style>
  </head>

</html>
