<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Learn Lists in HTML</h1>

    <!-- ordered list -->
    <ol type="1" start="51" reversed>
      <li>HTML</li>
      <li>CSS</li>
      <li>JS</li>
    </ol>

    <!-- unordered list -->
    <ul type="circle">
      <li>Node</li>
      <li>Java</li>
      <li>Python</li>
    </ul>

    <!-- description list -->
    <dl>
      <dt>description term</dt>
      <dd>description defination</dd>
    </dl>
  </body>
</html>
