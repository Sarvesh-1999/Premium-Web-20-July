<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Learn Forms in HTML</h1>

    <fieldset>
      <legend>Fill this form</legend>

      <form>
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter Username"
          name="username"
          required
        />
        <sup style="color: red">*</sup>

        <br /><br />

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="john@example.com"
          name="email"
        />
        <br /><br />

        <label for="gender">Gender</label>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">male</label>

        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">female</label>

        <br />

        <label for="country">Country</label>
        <select name="country" id="country" multiple>
          <option value="" disabled selected>Select here</option>
          <option value="india">India</option>
          <option value="china">China</option>
          <option value="russia">Russia</option>
        </select>

        <br />

        <label for="course">Course</label>
        <input type="text" id="course" list="courseList" />

        <datalist id="courseList">
          <option value="mern">mern</option>
          <option value="java">java</option>
          <option value="python">python</option>
        </datalist>

        <br />

        <label for="resume">Upload Resume</label>
        <input type="file" multiple accept=".docx,.pdf" />

        <br />

        <label for="hobbies">Hobbies</label>

        <input type="checkbox" name="hobbies" id="coding" value="coding" />
        <label for="coding">coding</label>

        <input type="checkbox" name="hobbies" id="gaming" value="gaming" />
        <label for="gaming">gaming</label>

        <br />

        <label for="dob">DOB</label>
        <input
          type="date"
          id="dob"
          name="dob"
          min="2000-01-01"
          max="2030-12-31"
        />

        <br />

        <label for="address">Address</label>
        <textarea
          name="address"
          id="address"
          cols="30"
          rows="5"
          style="resize: none"
        ></textarea>

        <br /><br />
        <button>submit</button>
      </form>
      
    </fieldset>
  </body>
</html>
