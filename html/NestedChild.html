<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Nested Page</h1>
    <!-- open page in parent webpage -->
    <a href="https://www.flipkart.com" target="_parent">flipkart</a>
    <br>
    <!-- open page in super most parent webpage -->
    <a href="https://www.amazon.in" target="_top">amazon</a>
    <br>
    <!-- open page in new tab -->
    <a href="https://www.myntra.com" target="_blank">myntra</a>
</body>
</html>
