<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <!-- ! BASIC TAGS -->
    <h1 style="background-color: yellow">Hello World</h1>
    <h2>Hello World</h2>
    <h3>Hello World</h3>
    <h4>Hello World</h4>
    <h5>Hello World</h5>
    <h6>Hello World</h6>

    <!-- ! TEXT FORMATTING TAGS -->
    <b style="background-color: yellow">bold</b>
    <i>italics</i>
    <u>underline</u>
    <strong>strong</strong>
    <em>emphasis</em>
    <ins>ins</ins>
    <strike>strike</strike>
    <del>del</del>
    <sup>superscript</sup>
    <sub>subscript</sub>

    <!-- 
    ! THERE ARE 3 TYPES OF ELEMENTS
    1) BLOCK
    - It takes full width of viewport
    - It accepts height and width property of CSS
    - example: heading tags, p, div etc

    2) INLINE
    - It takes only content width
    - It do not accepts height and width property of CSS
    - example: b, sub, sup, ins, span etc

    3) INLINE-BLOCK
    - It takes only content width
    - It accepts height and width property of CSS
    - example: img, iframe, video etc
    -->

    <div style="height: 250px; width: 200px; background-color: aqua">
      <img
        src="https://png.pngtree.com/png-vector/20231019/ourmid/pngtree-user-profile-avatar-png-image_10211467.png"
        alt="John Doe"
        height="80"
        width="80"
      />

      <h1>John <span style="color: white">Doe</span></h1>
      <h4>Web Developer</h4>
      <button>Hire me</button>
    </div>

    <img src="/Task1 Reacr.png" height="100" alt="" />
    <img src="/Task1 Reacr.png" height="100" alt="" />


    <!-- 
    ! THERE ARE 2 TYPES OF PATHS
    1) ABSOLUTE PATH : Path given directly from server. 
       ex: https://....
       
    2) RELATIVE PATH : Path given from workspace
       ex: / -> used to target root folder
          ./ -> used to target current folder
          ../ -> used to target previous folder
    -->



  </body>
</html>
